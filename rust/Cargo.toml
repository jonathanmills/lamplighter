# Lamplighter's Rust workspace: the engine, moving from C to Rust stage by
# stage (doc/RUST-PLAN.md). Built by `make` through autotools (Makefile.am
# here), with the version and features configure decided.

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "CECILL-C"
rust-version = "1.75"          # RHEL 9's rust-toolset is newer; keep this floor honest
repository = "https://github.com/jonathanmills/lamplighter"

[workspace.dependencies]
libc = "0.2"

[profile.release]
debug = 1                      # line tables, for the -debuginfo RPMs
