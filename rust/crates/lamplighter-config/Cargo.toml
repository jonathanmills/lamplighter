[package]
name = "lamplighter-config"
description = "Lamplighter's configuration parser: Robinhood's syntax, with the C parser's trees, line numbers and error messages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# Mirror configure's choices (Lustre, FIDs, changelogs, MDS stat), passed
# by ../../Makefile.am through configure's RUST_FEATURES.
lustre = []
fid = []
changelogs = []
mds_stat = []
# The engine modules configure builds besides the POSIX ones (lhsm, shook);
# backup is built whenever lustre and fid are.
lhsm = []
shook = []
shook_lhsmify = []

[dependencies]
libc.workspace = true
