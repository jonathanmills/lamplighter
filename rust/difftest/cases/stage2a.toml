# Stage 2a (doc/RUST-PLAN.md): the configuration modules every tool loads.
# The C cfgload (c/cfgload.c, the v1.0.0 modules) and the Rust one must
# print the same settings, error, warnings (stderr) and exit code.

[[case]]
name = "modules: edge cases"
reference = ["{cload}", "global,log,updt,lmgr", "{file}"]
candidate = ["{rust}/examples/cfgload", "global,log,updt,lmgr", "{file}"]
stderr = true
files = ["{here}/config-cases/modules/*.conf"]

[[case]]
name = "modules: test suite"
reference = ["{cload}", "global,log,updt,lmgr", "{file}"]
candidate = ["{rust}/examples/cfgload", "global,log,updt,lmgr", "{file}"]
stderr = true
files = ["{src}/tests/**/*.conf"]

[[case]]
name = "modules: templates and parser edge cases"
reference = ["{cload}", "global,log,updt,lmgr", "{file}"]
candidate = ["{rust}/examples/cfgload", "global,log,updt,lmgr", "{file}"]
stderr = true
files = ["{src}/doc/templates/**/*.conf", "{here}/config-cases/*.conf", "{src}/webui/devenv/engine/lamplighter.conf", "{here}/difftest.conf"]

# Stage 2a.3: the policy definitions (define_policy blocks), with the
# status managers they load and their scopes' boolean expressions.

[[case]]
name = "defs: edge cases"
reference = ["{cload}", "global,log,updt,lmgr,defs", "{file}"]
candidate = ["{rust}/examples/cfgload", "global,log,updt,lmgr,defs", "{file}"]
stderr = true
files = ["{here}/config-cases/defs/*.conf"]

[[case]]
name = "defs: templates, parser and module cases"
reference = ["{cload}", "global,log,updt,lmgr,defs", "{file}"]
candidate = ["{rust}/examples/cfgload", "global,log,updt,lmgr,defs", "{file}"]
stderr = true
files = ["{src}/doc/templates/**/*.conf", "{here}/config-cases/*.conf", "{here}/config-cases/modules/*.conf",
         "{src}/webui/devenv/engine/lamplighter.conf", "{here}/difftest.conf"]

[[case]]
name = "defs: test suite, tmpfs policies, numeric uid/gid no"
reference = ["{cload}", "global,log,updt,lmgr,defs", "{file}"]
candidate = ["{rust}/examples/cfgload", "global,log,updt,lmgr,defs", "{file}"]
stderr = true
files = ["{src}/tests/test_suite/cfg/*.conf"]
env = { RBH_TEST_POLICIES = "/build/difftest-env/policies-tmpfs.inc", RH_ROOT = "/tmp/mnt.rbh", FS_TYPE = "ext4", RH_DB = "robinhood_test", RBH_TEST_LAST_ACCESS_ONLY_ATIME = "no", RBH_NUM_UIDGID = "no" }

