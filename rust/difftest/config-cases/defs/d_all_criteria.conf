General { fs_path = /fs; fs_type = ext4; }
ListManager { MySQL { server = h; db = d; password = p; } }
define_policy p {
    scope { tree == "/a/**/b/" or path != "/x/*" or name == "a?b" or iname == "ABC" or type == symlink
            or owner == root or group != "w*" or size > 1G or depth < 3 or dircount >= 10
            or nlink <= 2 or last_access > 1w or last_mod < 30s or last_mdchange == 0
            or creation > 1y or fileclass == foo or status == "" or xattr.user.foo == "ba*r"
            or not (size == 0) }
    status_manager = basic;
    default_action = none;
    default_lru_sort_attr = size (asc);
}
