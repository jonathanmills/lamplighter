General { fs_path = /fs; fs_type = ext4; }
ListManager { MySQL { server = h; db = d; password = p; } }
define_policy a { scope = all; status_manager = alerter; default_action = none; default_lru_sort_attr = none; }
define_policy b { scope { alerter.status == alert } status_manager = alerter; default_action = none; default_lru_sort_attr = last_alert; }
define_policy c { scope { a.last_check > 1 } status_manager = checker; default_action = none; default_lru_sort_attr = b.last_alert; }
