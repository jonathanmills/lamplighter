General { fs_path = /fs; fs_type = ext4; }
ListManager { MySQL { server = h; db = d; password = p; } }
define_policy chk {
    scope { type == file and (last_check > 1d or output == "" or chk.status != ok) }
    status_manager = checker;
    default_action = cmd("/bin/true {path} {fid} {fsname} {cfg} {foo} {a.b} {x-y} {9} {Path}");
    default_lru_sort_attr = last_check (desc);
    status_current = ok;
}
define_policy al {
    scope { last_alert >= 2h and alerter.last_check < 3min }
    status_manager = alerter;
    default_action = alerter.alert;
    default_lru_sort_attr = none;
}
