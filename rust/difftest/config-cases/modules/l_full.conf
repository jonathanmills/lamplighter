General {
  fs_path = /fs;
  fs_type = ext4;
}
Log {
 debug_level = debug;
 log_file = /var/log/x.log;
 report_file = stdout;
 alert_file = SysLog;
 alert_mail = a@b;
 stats_interval = 10min;
 batch_alert_max = 0;
 alert_show_attrs = yes;
 syslog_facility = local3.warning;
 log_procname = yes;
 log_hostname = on;
}
ListManager {
  MySQL {
    server = host;
    db = dbname;
    password = pw;
  }
}
