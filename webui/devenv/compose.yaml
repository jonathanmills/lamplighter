# Lamplighter web UI development environment. Use ./devenv.sh rather
# than calling compose directly. All passwords here are TEST-ONLY.

name: lamplighter-dev

services:
  ldap:
    build: ./ldap
    image: localhost/lamplighter-dev-ldap
    volumes:
      - ./.certs:/certs:ro
    networks:
      default:
        aliases: [ldap.test]
    ports:
      - "127.0.0.1:6636:636"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    command:
      - start-dev
      - --import-realm
      - --http-enabled=false
      - --https-port=9443
      - --https-certificate-file=/certs/keycloak.test.pem
      - --https-certificate-key-file=/certs/keycloak.test.key
      - --hostname=https://keycloak.test:9443
      - --truststore-paths=/certs/ca.pem
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./.certs:/certs:ro
      - ./keycloak/realm-lamplighter.json:/opt/keycloak/data/import/realm-lamplighter.json:ro
    networks:
      default:
        aliases: [keycloak.test]
    ports:
      - "127.0.0.1:9443:9443"
    depends_on: [ldap]

  mariadb:
    image: docker.io/library/mariadb:10.5
    # Sized for scale tests (lamplighter-scale): real servers give InnoDB most of their memory.
    command: ["--innodb-buffer-pool-size=4G", "--innodb-log-file-size=1G"]
    environment:
      MARIADB_ROOT_PASSWORD: devroot
      MARIADB_DATABASE: robinhood_dev
      MARIADB_USER: robinhood
      MARIADB_PASSWORD: robinhood
    volumes:
      - lamplighter-db:/var/lib/mysql
      - ./mariadb/lamplighter_webui.sql:/docker-entrypoint-initdb.d/20-lamplighter_webui.sql:ro
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # Rocky Linux 9.7 workbench: builds and runs Robinhood, runs tests.
  workbench:
    build: ./engine
    image: localhost/lamplighter-dev-engine
    hostname: workbench
    volumes:
      - ../..:/src:ro             # the repository (read-only)
      - .:/devenv:ro              # this directory
      - ./.certs:/certs:ro
      - lamplighter-build:/build          # out-of-tree copy + build of Robinhood
    tmpfs:
      - /data:size=4g,mode=0755   # scanned filesystem (sparse test files)
    depends_on:
      mariadb:
        condition: service_healthy

  # Web UI back end (FastAPI), with live reload from the source tree.
  webui:
    build: ../backend
    image: localhost/lamplighter-dev-webui
    environment:
      LAMPLIGHTER_WEBUI_CONFIG: /devenv/webui/config.yaml
      # File events from a macOS host don't reach the VM: poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend:/app             # source, tests (editable install)
      - ../frontend/dist:/srv/frontend:ro   # built by the frontend service
      - .:/devenv:ro
      - ./.certs:/certs:ro
      - lamplighter-jobstats-spool:/var/spool/lamplighter-jobstats
    networks:
      default:
        aliases: [webui.test]
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      mariadb:
        condition: service_healthy
      keycloak:
        condition: service_started

  # Front-end builder: rebuilds webui/frontend/dist on every change.
  # Node runs only here, never on the Mac or on servers.
  frontend:
    image: docker.io/library/node:22-alpine
    working_dir: /app
    command: ["sh", "/devenv/frontend-watch.sh"]
    volumes:
      - ../frontend:/app
      - .:/devenv:ro
      - lamplighter-node-modules:/app/node_modules

  # Optional: Prometheus scraping a simulated jobstats exporter, for the
  # Prometheus jobstats source. Start with: devenv.sh prometheus
  jobstats-exporter:
    image: docker.io/library/python:3.12-slim
    profiles: [prometheus]
    command: ["python", "/devenv/tools/fake_jobstats_exporter.py", "9169"]
    volumes:
      - .:/devenv:ro
  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    profiles: [prometheus]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [jobstats-exporter]

  # Optional: Checkmk Community 2.5 for installing the plugin in a real site.
  # x86-64 hosts only: the image is amd64-only, and the site does not start
  # under emulation on Apple Silicon (use "devenv.sh checkmk-test" there).
  # Start with: docker compose --profile checkmk up -d checkmk
  checkmk:
    image: docker.io/checkmk/check-mk-community:2.5.0p21
    profiles: [checkmk]
    environment:
      CMK_SITE_ID: cmk
      CMK_PASSWORD: cmkadmin            # TEST-ONLY password for cmkadmin
      TZ: UTC
    volumes:
      - ../checkmk:/plugin:ro           # the plugin source (webui/checkmk)
      - ./.certs:/certs:ro
    ports:
      - "127.0.0.1:5000:5000"
    depends_on: [webui]

volumes:
  lamplighter-db:
  lamplighter-build:
  lamplighter-node-modules:
  lamplighter-jobstats-spool:
