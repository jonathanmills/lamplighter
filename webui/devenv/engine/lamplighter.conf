# Robinhood configuration for the dev environment: scans the generated
# test tree in /data (a tmpfs) into the dev MariaDB.

General {
    fs_path = /data;
    fs_type = tmpfs;
}

Log {
    debug_level = MAJOR;
    log_file = stderr;
    report_file = stderr;
    alert_file = stderr;
}

ListManager {
    MySQL {
        server = mariadb;
        db = robinhood_dev;
        user = robinhood;
        password_file = /devenv/engine/db.password;
        engine = InnoDB;
    }
}

FS_Scan {
    nb_threads_scan = 4;
}

EntryProcessor {
    nb_threads = 4;
}

# Fileclasses, and an alert policy used purely as a classifier: it marks
# entries alert/clear in the database (alert_status); thresholds and
# notifications belong to Checkmk. Run it with "devenv.sh classify".
%include "/src/doc/templates/includes/alerts.inc"

FileClass scratch {
    definition { tree == "/data/scratch" }
}
FileClass genomics {
    definition { tree == "/data/projects/proj-genomics" }
}
FileClass big_files {
    definition { type == file and size > 1GB }
}
FileClass small_files {
    definition { type == file and size <= 32KB }
}
# watched by Checkmk through the classifier rules below
FileClass outsized {
    definition { type == file and size > 20GB }
}

alert_rules {
    # scratch data nobody has read for a month
    rule stale_scratch {
        target_fileclass = scratch;
        action_params { title = "stale scratch"; }
        condition { type == file and last_access > 30d }
    }
    rule outsized {
        target_fileclass = outsized;
        action_params { title = "outsized file"; }
        condition = true;
    }
    rule default {
        action = none;
        action_params { alert = clear; }
        condition = true;
    }
}
