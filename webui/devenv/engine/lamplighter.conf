# Robinhood configuration for the dev environment: scans the generated
# test tree in /data (a tmpfs) into the dev MariaDB.

General {
    fs_path = /data;
    fs_type = tmpfs;
}

Log {
    debug_level = MAJOR;
    log_file = stderr;
    report_file = stderr;
    alert_file = stderr;
}

ListManager {
    MySQL {
        server = mariadb;
        db = robinhood_dev;
        user = robinhood;
        password_file = /devenv/engine/db.password;
        engine = InnoDB;
    }
}

FS_Scan {
    nb_threads_scan = 4;
}

EntryProcessor {
    nb_threads = 4;
}
