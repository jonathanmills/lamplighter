# Web UI configuration for the dev environment. Secrets live in the
# *.secret files next to this one (TEST-ONLY values).

server:
  base_url: https://webui.test:8443
  session_secret_file: /devenv/webui/session.secret
  frontend_dir: /srv/frontend

oidc:
  enabled: true
  issuer: https://keycloak.test:9443/realms/lamplighter
  client_id: lux-webui
  client_secret_file: /devenv/webui/oidc-client.secret
  ca_file: /certs/ca.pem

ldap:
  servers: [ldaps://ldap.test:636]
  ca_file: /certs/ca.pem
  bind_dn: cn=lux-webui,ou=services,dc=lamplighter,dc=test
  bind_password_file: /devenv/webui/ldap-bind.secret
  directory_type: rfc2307bis
  users:
    base_dn: ou=people,dc=lamplighter,dc=test
    scope: one
  groups:
    base_dn: ou=groups,dc=lamplighter,dc=test
    membership: memberof

login:
  ldap_bind_enabled: true

access:
  bootstrap_admin_groups:
    - cn=lux-admins,ou=groups,dc=lamplighter,dc=test
  role_mappings:
    - group: cn=lux-data-managers,ou=groups,dc=lamplighter,dc=test
      roles: [data-manager]
    - group: cn=lux-viewers,ou=groups,dc=lamplighter,dc=test
      roles: [viewer]

database:
  host: mariadb
  name: robinhood_dev
  user: robinhood
  password_file: /devenv/webui/db.secret

store:
  host: mariadb
  name: lux_webui
  user: lux_webui
  password_file: /devenv/webui/store.secret

collector:
  keep_runs: 90

# Lustre jobstats for triage. The dev spool is filled by
# 'devenv.sh jobstats' (tools/gen_jobstats.py) with simulated servers.
jobstats:
  source: spool
  spool:
    directory: /var/spool/lux-jobstats
  stale_after_seconds: 300

monitoring:
  enabled: true
  audience: lux-webui
  required_role: monitoring
