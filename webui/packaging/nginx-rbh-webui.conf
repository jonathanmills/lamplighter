#
# nginx in front of the Robinhood web UI: TLS termination and a reverse
# proxy to the app on 127.0.0.1:8000. Copy to /etc/nginx/conf.d/rbh-webui.conf,
# set server_name and the certificate paths, then: nginx -t && systemctl reload nginx
#
# SELinux (Rocky/RHEL): let nginx connect to the app:
#     setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    listen [::]:80;
    server_name robinhood.example.org;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" because Rocky/RHEL 9 ship nginx 1.20 (no "http2 on;" before 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name robinhood.example.org;

    ssl_certificate     /etc/pki/tls/certs/robinhood.example.org.pem;
    ssl_certificate_key /etc/pki/tls/private/robinhood.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rbh_webui:10m;

    # The app sets its own CSP and frame headers; HSTS here, at the TLS edge.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
